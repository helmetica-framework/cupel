# A claim of the CRD generated from claimdefinition.yaml. Chrysopoeia records a
# ClaimRevision next to it, owned by the claim, for every change to its
# version or values.
#
# Browse its revisions with:
#   cupel ledger podinfo/my-app
apiVersion: v6.podinfo.helmetica-bundles.io/bundle
kind: PodInfo
metadata:
  name: my-app
spec:
  approval:
    strategy: Manual
  version: 6.5.0
  values:
    replicaCount: 1
    ui:
      message: "hello from the claim"
